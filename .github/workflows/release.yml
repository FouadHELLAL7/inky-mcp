name: Release image (manual)

# Publishes a container image to GHCR. MANUAL ONLY: it never runs on push or
# pull request. Run it from the Actions tab only after deciding to publish.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag (e.g. 1.0.0)"
        required: true
      confirm:
        description: "Type 'publish' to push the image to ghcr.io"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: ${{ github.event.inputs.confirm == 'publish' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/inky-mcp
          docker build \
            --build-arg VERSION=${{ github.event.inputs.version }} \
            --build-arg COMMIT_SHA=${{ github.sha }} \
            --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -t "$IMAGE:${{ github.event.inputs.version }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.event.inputs.version }}"
          docker push "$IMAGE:latest"
